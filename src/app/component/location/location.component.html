<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-inline w-100">
    <div class="flex-grow-1 me-2">
      <input
        type="text"
        id="location"
        name="location"
        formControlName="location"
        class="form-control"
        placeholder="Enter location"
      />
    </div>
    <button type="submit" class="btn btn-primary">Search</button>
  </form>
